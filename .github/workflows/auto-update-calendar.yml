name: Automatically Update Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: boxing-calendar-main-writer
  cancel-in-progress: false
  queue: max

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-calendar
      - name: Restore operational source-health history
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/source-health.json
          key: source-health-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: source-health-
      - name: Check official boxing sources and apply safe updates
        id: discover
        shell: bash
        run: |
          set +e
          python scripts/discover.py --apply --report "$RUNNER_TEMP/discovery-report.json" --health-state "$RUNNER_TEMP/source-health.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 10 ]; then
            exit "$code"
          fi
      - run: python scripts/validate.py --previous-ref HEAD
      - name: Regenerate calendar and website
        run: python scripts/generate.py
      - run: python -m pytest -q
      - name: Add source health to workflow summary
        if: always()
        run: python scripts/summarize_discovery.py "$RUNNER_TEMP/discovery-report.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve operational source-health history
        if: always() && steps.discover.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/source-health.json
          key: source-health-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boxing-discovery-report-${{ github.run_id }}
          path: ${{ runner.temp }}/discovery-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit discovery results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/proposed-events.json major-boxing-calendar.ics index.html
          if [ "${{ steps.discover.outputs.exit_code }}" = "10" ]; then
            git add data/events.json
          fi
          if git diff --cached --quiet; then
            echo "No discovery changes to commit."
            exit 0
          fi
          git commit -m "Automatically update boxing discovery results"
          git push
      - uses: ./.github/actions/prepare-pages

  publish:
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
