name: Build and Publish Calendar

on:
  push:
    branches: [main]
    paths:
      - "data/events.json"
      - "data/proposed-events.json"
      - "scripts/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/actions/setup-calendar/**"
      - ".github/workflows/build-calendar.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boxing-calendar-main-writer
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup-calendar
      - run: python scripts/validate.py --previous-ref HEAD^
      - run: python scripts/generate.py
      - run: python -m pytest -q
      - name: Commit generated files
        run: |
          if git diff --quiet -- major-boxing-calendar.ics index.html; then
            echo "Generated files are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add major-boxing-calendar.ics index.html
          git commit -m "Rebuild calendar and website"
          git push
