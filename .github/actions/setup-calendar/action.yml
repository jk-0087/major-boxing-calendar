name: Set up boxing calendar
description: Install the pinned Python runtime and cached project dependencies

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt
    - shell: bash
      run: python -m pip install -r requirements.txt -r requirements-dev.txt
